# Only the settings klickList relies on. Run `supabase init` first if you want the full file,
# then copy these sections across.
project_id = "klicklist"

[auth]
site_url = "http://localhost:5173"
enable_signup = false          # private by default: only accounts you create can sign in

[auth.email]
enable_signup = false
otp_length = 6
otp_expiry = 600

[auth.sms]
enable_signup = false

# Each function checks the caller's sign-in itself (auth.getUser + allowlist), which works with both the
# legacy and the newer Supabase key types. The gateway's own JWT check is off because it doesn't
# understand the newer keys.
[functions.analyze-item]
verify_jwt = false

[functions.ai-batch]
verify_jwt = false

[functions.price-check]
verify_jwt = false
